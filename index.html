<!-- MODAL DE CHECKOUT: Optimizado para Cierre Total -->
<div id="modalCheckout" class="modal-overlay">
  <div class="modal-card">
    
    <!-- PASO 1: CHECKLIST -->
    <div id="step-check">
      <h2 style="color: var(--primary);">Cierre de Estancia</h2>
      <p style="font-size: 0.85rem; color: var(--slate); margin-bottom: 1.2rem;">Por favor, confirma estos puntos de cuidado:</p>
      <div style="text-align:left; margin-bottom: 1.5rem;">
        <label><input type="checkbox" class="check-item"> A/C y Luces apagadas</label>
        <label><input type="checkbox" class="check-item"> Basura en contenedores</label>
        <label><input type="checkbox" class="check-item"> Ventanas y Balcón cerrados</label>
        <label><input type="checkbox" class="check-item"> Gas y Llaves en orden</label>
      </div>
      <button class="btn-modal btn-primary" onclick="verifyChecklist()">Confirmar y continuar</button>
      <button class="btn-modal btn-ghost" onclick="closeModal()">Seguir aquí</button>
    </div>

    <!-- PASO 2: FEEDBACK (Último paso visual) -->
    <div id="step-ask" class="hidden">
      <h2>¿Cómo fue tu experiencia?</h2>
      <p style="font-size: 0.9rem; margin-bottom: 1.2rem;">Tu mensaje nos ayuda a mejorar personalmente.</p>
      
      <!-- Al hacer clic, se ejecuta el cierre total -->
      <button class="btn-modal btn-primary" onclick="finalProcess('¡Excelente estancia! ⭐⭐⭐⭐⭐')">
        ¡Excelente! Todo perfecto
      </button>
      
      <button class="btn-modal btn-ghost" onclick="finalProcess('Estancia buena, tengo algunas sugerencias.')">
        Hubo detalles / sugerencias
      </button>
    </div>

  </div>
</div>

<script>
  const WA_NUMBER = "523328329427";
  const DEPT_INFO = "CarAle 302";

  const modal = document.getElementById('modalCheckout');
  
  function openCheckout() { 
    modal.style.display = 'flex'; 
    resetModal(); 
  }

  function closeModal() { 
    modal.style.display = 'none'; 
  }

  function verifyChecklist() {
    const checks = document.querySelectorAll('.check-item');
    let ok = true;
    checks.forEach(c => { if(!c.checked) ok = false; });
    if(ok) goStep('ask'); else alert("Por favor, confirma los puntos de cuidado para finalizar.");
  }

  function goStep(stepId) {
    document.getElementById('step-check').classList.add('hidden');
    document.getElementById('step-ask').classList.add('hidden');
    document.getElementById('step-' + stepId).classList.remove('hidden');
  }

  // --- FUNCIÓN DE CIERRE NEURO-EFICIENTE ---
  function finalProcess(feedback) {
    // 1. Preparamos el mensaje
    const message = `Hola! 👋 Confirmo mi salida de ${DEPT_INFO}. %0A%0A✅ Checklist completado. %0A⭐ Feedback: ${feedback}`;
    
    // Usamos el link universal para mayor compatibilidad sin fricción
    const waUrl = `https://wa.me/${WA_NUMBER}?text=${message}`;

    // 2. CIERRE INMEDIATO (Neuro-limpieza)
    // Cerramos el modal antes de que la App de WA se abra.
    // Así, si el usuario vuelve al navegador, la pantalla está limpia.
    closeModal();

    // 3. REDIRECCIÓN TRAS UN MILISEGUNDO
    // Damos tiempo ínfimo para que el DOM procese el cierre del modal
    setTimeout(() => {
      window.location.href = waUrl;
    }, 100);
  }

  function resetModal() {
    document.getElementById('step-check').classList.remove('hidden');
    document.getElementById('step-ask').classList.add('hidden');
    document.querySelectorAll('.check-item').forEach(c => c.checked = false);
  }

  // Copiar WiFi (Mantenemos la funcionalidad original ganadora)
  function copyWifi() {
    const pass = "qnaPW5gfYF";
    const label = document.getElementById('wifi-label');
    navigator.clipboard.writeText(pass).then(() => {
      label.innerText = "¡Copiado! 🎉";
      label.parentElement.style.background = "#10b981";
      setTimeout(() => {
        label.innerText = "Copiar Clave Wi-Fi";
        label.parentElement.style.background = "#0284c7";
      }, 3000);
    });
  }

  window.onclick = function(e) { if(e.target == modal) closeModal(); }
</script>
