<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarAle - Apartment</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- HEADER -->
<header class="app-header">
  <span></span>
  <h1>CarAle - APARTMENT</h1>
  <span></span>
</header>

<!-- GRID -->
<div class="grid">

  <a class="card" href="reglamento.html">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <rect x="4" y="2" width="14" height="20" rx="2"/>
        <path d="M8 6h6"/>
        <path d="M8 10h6"/>
        <path d="M8 14h6"/>
      </svg>
    </div>
    <span>Reglamento</span>
  </a>

  <a class="card" href="wifi.html">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <path d="M2 8.82C6.97 4.56 17.03 4.56 22 8.82"/>
        <path d="M5 12.36C8.76 9.2 15.24 9.2 19 12.36"/>
        <path d="M8.5 15.9C10.91 14.1 13.09 14.1 15.5 15.9"/>
        <circle cx="12" cy="19" r="1"/>
      </svg>
    </div>
    <span>WiFi</span>
  </a>

  <a class="card" href="contactos.html">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <path d="M4 2h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 4 4a2 2 0 0 1 2-2z"/>
      </svg>
    </div>
    <span>Contactos</span>
  </a>

  <a class="card emergency" href="emergencias.html">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <path d="M12 3l9 16H3L12 3z"/>
        <path d="M12 9v4"/>
        <circle cx="12" cy="16" r="1"/>
      </svg>
    </div>
    <span>Emergencias</span>
  </a>

  <!-- COMO LLEGAR -->
  <div class="card" id="btnComoLlegar">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <path d="M12 21s6-5.33 6-10a6 6 0 0 0-12 0c0 4.67 6 10 6 10z"/>
        <circle cx="12" cy="11" r="2"/>
      </svg>
    </div>
    <span>C贸mo llegar</span>
  </div>

  <a class="card" href="https://www.tripadvisor.com.mx" target="_blank">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <circle cx="9" cy="12" r="2"/>
        <circle cx="15" cy="12" r="2"/>
        <path d="M2 4h20"/>
      </svg>
    </div>
    <span>Tripadvisor</span>
  </a>

</div>

<!-- MAP SELECTOR -->
<div class="map-modal hidden" id="mapModal">
  <div class="map-sheet">
    <h3>Elegir aplicaci贸n</h3>

    <a href="https://www.google.com/maps/search/?api=1&amp;query=20.736828,-105.256792"
       target="_blank" rel="noopener">
      Google Maps
    </a>

    <a href="https://waze.com/ul?ll=20.736828,-105.256792&amp;navigate=yes"
       target="_blank" rel="noopener">
      Waze
    </a>

    <a href="https://maps.apple.com/?ll=20.736828,-105.256792&amp;q=Diamante%20Taylor%20Burton%2C%20Edificio%20de%20departamentos"
       target="_blank" rel="noopener">
      Apple Maps
    </a>

    <button id="btnCancelar">Cancelar</button>
  </div>
</div>

<!-- JS (Safari-safe) -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("btnComoLlegar");
    var modal = document.getElementById("mapModal");
    var cancel = document.getElementById("btnCancelar");

    btn.addEventListener("click", function () {
      modal.classList.remove("hidden");
    });

    cancel.addEventListener("click", function () {
      modal.classList.add("hidden");
    });

    modal.addEventListener("click", function (e) {
      if (e.target === modal) {
        modal.classList.add("hidden");
      }
    });
  });
</script>

</body>
</html>
